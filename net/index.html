<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>War Fight - Godot Web Export</title>
    <style>
        html, body, #canvas {
            margin: 0;
            padding: 0;
            border: 0;
        }
        body {
            color: white;
            background-color: black;
            overflow: hidden;
            touch-action: none;
        }
        #canvas {
            display: block;
        }
        #canvas:focus {
            outline: none;
        }
        #status, #status-splash, #status-progress {
            position: absolute;
            left: 0;
            right: 0;
        }
        #status, #status-splash {
            top: 0;
            bottom: 0;
        }
        #status {
            background-color: #242424;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            visibility: hidden;
        }
        #status-splash {
            max-height: 100%;
            max-width: 100%;
            margin: auto;
        }
        #status-splash.show-image--false {
            display: none;
        }
        #status-splash.fullsize--true {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }
        #status-splash.use-filter--false {
            image-rendering: pixelated;
        }
        #status-progress, #status-notice {
            display: none;
        }
        #status-progress {
            bottom: 10%;
            width: 50%;
            margin: 0 auto;
        }
        #status-notice {
            background-color: #5b3943;
            border-radius: 0.5rem;
            border: 1px solid #9b3943;
            color: #e0e0e0;
            font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
            line-height: 1.3;
            margin: 0 2rem;
            overflow: hidden;
            padding: 1rem;
            text-align: center;
            z-index: 1;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 10;
        }
        .loading .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #fff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="server.icon.png" />
    <link rel="apple-touch-icon" href="server.apple-touch-icon.png"/>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div>Loading Game...</div>
    </div>
    
    <div id="status">
        <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="server.png" alt="">
        <progress id="status-progress"></progress>
        <div id="status-notice"></div>
    </div>

    <noscript>
        Your browser does not support JavaScript. Please enable JavaScript to play this game.
    </noscript>

    <script src="server.js"></script>
    <script>
        // Wait for DOM and scripts to load
        (function() {
            const statusOverlay = document.getElementById('status');
            const statusProgress = document.getElementById('status-progress');
            const statusNotice = document.getElementById('status-notice');
            const loadingDiv = document.getElementById('loading');
            
            let initializing = true;
            let statusMode = '';
            
            function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                    return;
                }
                if (mode === 'hidden') {
                    statusOverlay.style.visibility = 'hidden';
                    if (loadingDiv) loadingDiv.style.display = 'none';
                    initializing = false;
                    return;
                }
                statusOverlay.style.visibility = 'visible';
                if (loadingDiv) loadingDiv.style.display = 'none';
                statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
            }
            
            function setStatusNotice(text) {
                while (statusNotice.lastChild) {
                    statusNotice.removeChild(statusNotice.lastChild);
                }
                const lines = text.split('\n');
                lines.forEach((line) => {
                    statusNotice.appendChild(document.createTextNode(line));
                    statusNotice.appendChild(document.createElement('br'));
                });
            }
            
            function displayFailureNotice(err) {
                console.error(err);
                if (err instanceof Error) {
                    setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                    setStatusNotice(err);
                } else {
                    setStatusNotice('An unknown error occurred.');
                }
                setStatusMode('notice');
                initializing = false;
            }
            
            // Wait for the Engine to be defined
            function waitForEngine() {
                if (typeof Engine !== 'undefined') {
                    startGame();
                } else {
                    setTimeout(waitForEngine, 100);
                }
            }
            
            function startGame() {
                const GODOT_CONFIG = {
                    "args": [],
                    "canvasResizePolicy": 2,
                    "emscriptenPoolSize": 8,
                    "ensureCrossOriginIsolationHeaders": true,
                    "executable": "server",
                    "experimentalVK": false,
                    "fileSizes": {
                        "server.pck": 59448,
                        "server.wasm": 38034280
                    },
                    "focusCanvas": true,
                    "gdextensionLibs": [],
                    "godotPoolSize": 4
                };
                
                const GODOT_THREADS_ENABLED = false;
                const engine = new Engine(GODOT_CONFIG);
                
                const missing = Engine.getMissingFeatures({
                    threads: GODOT_THREADS_ENABLED,
                });
                
                if (missing.length !== 0) {
                    if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                        let serviceWorkerRegistrationPromise;
                        try {
                            serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                        } catch (err) {
                            serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
                        }
                        Promise.race([
                            serviceWorkerRegistrationPromise.then((registration) => {
                                if (registration != null) {
                                    return Promise.reject(new Error('Service worker already exists.'));
                                }
                                return registration;
                            }).then(() => engine.installServiceWorker()),
                            new Promise((resolve) => {
                                setTimeout(() => resolve(), 2000);
                            }),
                        ]).then(() => {
                            window.location.reload();
                        }).catch((err) => {
                            console.error('Error while registering service worker:', err);
                            displayFailureNotice('Failed to register service worker: ' + err.message);
                        });
                    } else {
                        const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
                        displayFailureNotice(missingMsg + missing.join('\n'));
                    }
                } else {
                    setStatusMode('progress');
                    engine.startGame({
                        'onProgress': function (current, total) {
                            if (current > 0 && total > 0) {
                                statusProgress.value = current;
                                statusProgress.max = total;
                                if (loadingDiv) {
                                    const percent = Math.round((current / total) * 100);
                                    loadingDiv.innerHTML = `<div class="spinner"></div><div>Loading... ${percent}%</div>`;
                                }
                            } else {
                                statusProgress.removeAttribute('value');
                                statusProgress.removeAttribute('max');
                            }
                        },
                    }).then(() => {
                        setStatusMode('hidden');
                    }, displayFailureNotice);
                }
            }
            
            // Start the process
            waitForEngine();
        })();
    </script>
</body>
</html>
